name: 自动同步上游Fork（自动识别父仓库）
# 权限必须开启写入
permissions:
  contents: write
on:
  # 定时：UTC 0点 = 北京时间8点每日同步
  schedule:
    - cron: '0 0 * * *'
  # 页面手动一键运行
  workflow_dispatch:

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    # 仅当本仓库是Fork才执行，普通仓库跳过
    if: ${{ github.event.repository.fork == true }}
    steps:
      - name: 检出当前Fork仓库完整代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Git提交用户
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "sync-bot@github.com"

      - name: 自动获取上游仓库地址
        id: get_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh api 获取当前仓库父仓库clone地址
          UPSTREAM=$(gh api repos/${{ github.repository }} --jq '.parent.clone_url')
          echo "UPSTREAM_REPO=$UPSTREAM" >> $GITHUB_ENV
          echo "上游仓库地址：$UPSTREAM"

      - name: 绑定上游并拉取最新代码
        run: |
          git remote add upstream ${{ env.UPSTREAM_REPO }}
          git fetch upstream

      - name: 合并上游main分支
        run: |
          git checkout main
          # 自动合并，无冲突自动提交
          git merge upstream/main -m "auto sync upstream $(date '+%Y-%m-%d')"
          # 无变更则直接退出，不产生空提交
          if [[ -z $(git status --porcelain) ]]; then
            echo "代码已是最新，无需推送"
            exit 0
          fi

      - name: 推送到自己的Fork仓库
        run: git push origin main
